<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer hexagon ring -->
  <polygon
    points="16,2 28,9 28,23 16,30 4,23 4,9"
    stroke="#0ea5e9"
    stroke-width="2"
    fill="none"
    stroke-linejoin="round"
  />
  <!-- Middle ring -->
  <polygon
    points="16,7 23,11 23,21 16,25 9,21 9,11"
    stroke="#0284c7"
    stroke-width="1.5"
    fill="none"
    stroke-linejoin="round"
    opacity="0.7"
  />
  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="#0ea5e9" />
  <!-- Cross hairs -->
  <line x1="16" y1="10" x2="16" y2="13" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="19" x2="16" y2="22" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="16" x2="13" y2="16" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="19" y1="16" x2="22" y2="16" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
