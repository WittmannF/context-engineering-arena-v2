name: Validate

on:
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install arena-cli
        run: |
          cd arena
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Validate tasks and submissions
        run: |
          source arena/.venv/bin/activate
          python -m arena_cli.cli validate

      - name: Build catalog
        run: |
          source arena/.venv/bin/activate
          python -m arena_cli.cli build-catalog

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/site/package-lock.json

      - name: Install site dependencies
        run: cd packages/site && npm ci

      - name: Build site
        run: cd packages/site && npm run build
