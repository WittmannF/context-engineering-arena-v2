[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-cli"
version = "0.1.0"
description = "CLI tools for Context Engineering Arena"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jsonschema>=4.0.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
arena = "arena_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["arena_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
