id: task-001-enron-investigation
title: "The Enron Investigation Brief"
short_description: "Given the Enron email archive, build an evidence-backed investigative page revealing warning signs, communication patterns, and internal tensions before the collapse."
long_description: |
  The Enron Email Dataset contains over 500,000 emails from ~150 Enron employees, made public during the FERC investigation. This task challenges participants to process this messy human communication corpus and build an investigative page that helps readers understand what was happening inside Enron before its collapse.

  The task tests email parsing, entity extraction, temporal reasoning, topic clustering, evidence selection, graph thinking, and uncertainty handling. A good submission should distinguish directly supported facts from plausible interpretations, and explicitly flag speculation.

benchmark_question: "What warning signs, coordination patterns, or internal tensions were visible before the collapse, and what evidence supports those conclusions?"

domain: corporate-investigation
difficulty: hard
tags:
  - email
  - investigation
  - nlp
  - temporal-reasoning
  - entity-extraction
  - graph
  - corporate

dataset:
  name: "Enron Email Dataset (CMU)"
  source_url: "https://www.cs.cmu.edu/~enron/"
  license: "Public domain (released by FERC for investigation purposes)"
  access_method: direct_download
  expected_size: "~1.7 GB compressed, 517,401 emails"
  sample_available: true

outputs:
  required_sections:
    - executive-summary
    - investigative-timeline
    - key-people-and-communication-patterns
    - main-themes-and-topic-clusters
    - evidence-backed-claims
    - contradictions-and-weak-signals
    - documents-that-mattered-most
    - what-was-ignored-and-why
    - context-engineering-strategy
    - ethical-and-evidentiary-limitations
  required_visualizations:
    - timeline
    - people-graph-or-placeholder
    - claim-evidence-table
    - communication-hub-cards
    - topic-cluster-cards
    - uncertainty-box
  required_claim_types:
    - fact
    - interpretation
    - uncertainty

scoring:
  dimensions:
    - evidence_quality
    - timeline_quality
    - entity_extraction_quality
    - uncertainty_handling
    - hallucination_avoidance
    - context_efficiency
    - usefulness_of_final_page
  automatic_metrics:
    - evidence_id_coverage_rate
    - claim_confidence_distribution
    - timeline_completeness
  human_metrics:
    - factual_accuracy
    - investigative_insight
    - visual_clarity
    - uncertainty_handling_quality

safety:
  privacy_risks:
    - "Dataset contains personal emails of real individuals, some of whom faced prosecution."
    - "Some individuals in the dataset were not senior executives and had peripheral involvement."
  legal_risks:
    - "This dataset was released under FERC subpoena; treat as public record."
    - "Do not make defamatory claims against named individuals without strong evidence."
  recommended_mitigations:
    - "Focus on organizational patterns rather than individual blame."
    - "Clearly distinguish evidence from interpretation."
    - "Mark all inferences about intent as uncertain."
    - "Do not reproduce email content verbatim beyond short evidentiary excerpts."
