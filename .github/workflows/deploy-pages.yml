# NOTE: Enable GitHub Pages in repository Settings > Pages > Source: GitHub Actions
# This workflow deploys the site on every push to main.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install arena-cli
        run: |
          cd arena
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Build catalog
        run: |
          source arena/.venv/bin/activate
          python -m arena_cli.cli build-catalog

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/site/package-lock.json

      - name: Install site dependencies
        run: cd packages/site && npm ci

      - name: Build site
        env:
          GITHUB_PAGES: 'true'
        run: cd packages/site && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
